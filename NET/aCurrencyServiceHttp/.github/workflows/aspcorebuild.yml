name: aCurrencyServiceHttp

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Debug
  DOTNET_VERSION: '3.1.x'
  ARTIFACT_NAME: '.aCurrencyServiceHttp-app'
  JFROG_ARTIFACTORY_URL: https://alexbitartifactory.jfrog.io/artifactory/
  
  
permissions:
  contents: read

jobs:
  buildSolution:
    runs-on: ubuntu-latest
    steps:
    
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Publish
      run: dotnet publish -r linux-x64 --self-contained false
      
    - name: Test
      run:  | 
          dotnet test --no-build --verbosity normal
          uname -a
          ls bin/Debug/netcoreapp3.1/linux-x64/publish/
          pwd

    - name: Upload artifact for deployment job    
      uses: actions/upload-artifact@v3
      with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /home/runner/work/aCurrencyServiceHttp/aCurrencyServiceHttp/bin/Debug/netcoreapp3.1/linux-x64/publish/
          if-no-files-found: error
          retention-days: 2

  uploadToArtifactory:    
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: ${{ env.ARTIFACT_NAME }}
      
      - uses: jfrog/setup-jfrog-cli@v1

      - name: Check JFrog
        run:  jfrog --version

      - name: Compress Artifact with TAR.GZ
        run:  | 
              ls -a
              tar cfvz ${{env.JFROG_CLI_BUILD_NAME}}-v.0.0.${{env.JFROG_CLI_BUILD_NUMBER}}.tar.gz *
              echo "---"
              ls -l

  createDockerContainer:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Docker
      - run: |
          docker