name: Publish beta test app image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/beta-test-app

jobs:
  build-and-push-beta-test-app:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("python/mesh-istio-test-bg/beta-test-app/pyproject.toml", "rb") as file:
              project = tomllib.load(file)

          print(f"value={project['project']['version']}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha
          labels: |
            org.opencontainers.image.title=Beta test app
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.description=HTTP service for testing communication with alpha in a cluster
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./python/mesh-istio-test-bg/beta-test-app
          file: ./python/mesh-istio-test-bg/beta-test-app/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
